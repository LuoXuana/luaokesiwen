// =====================================================
//  surf110_optimized.cfg — CS:S Surf 100 Tick | yawspeed 110
//  基于 洛轩 原版配置优化
//  优化日期: 2026-05-07
//  优化说明: 修复 restore 系统 + 重构高低速切换 + CS:S 原生适配
// =====================================================

// ── [1] 网络设置 (100 Tick 优化) ─────────────────────
//  注意: CS:S 原生 rate 上限为 30000，若服务器支持可手动改高
fps_max 600                      // 原 1100 → CS:S 物理引擎在 >600 时可能抖动
rate 30000                       // 原 786432 是 CS:GO 的值，CS:S 上限 30000
cl_updaterate 100                // 匹配 100 tick
cl_cmdrate 100                   // 匹配 100 tick
cl_interp 0                      // 关闭插值
cl_interp_ratio 1
cl_lagcompensation 1
cl_smooth 0                      // 关闭视角平滑 → 更跟手
cl_smoothtime 0
cl_resend 1.5                    // 丢包重发更快 (默认 2)
cl_timeout 9999                  // 防止长时间 surf 掉线

// ── [2] 多核渲染 ────────────────────────────────────
mat_queue_mode -1                // 自动多核 (9800X3D 最优)

// ── [3] 视角 & 手臂优化 ─────────────────────────────
cl_bob 0                         // 关闭武器抖动
cl_bobcycle 2
viewmodel_fov 80                 // 手臂更靠前，视野更开阔

// ── [4] 准星 ────────────────────────────────────────
cl_crosshairalpha 255
cl_crosshaircolor 5              // 青色
cl_crosshairsize 3
cl_crosshairthickness 1
cl_crosshairdot 0

// ── [5] 音频 ────────────────────────────────────────
dsp_enhance_stereo 1
snd_mixahead 0.05                // 低延迟 (若爆音，改回 0.08~0.10)

// ── [6] FPS 优化 ─────────────────────────────────────
r_dynamic 0                      // 关闭动态光照
r_3dsky 0                        // 关闭 3D 天空盒
r_shadows 0                      // 关闭阴影
r_WaterDrawReflection 0          // 关闭水面反射
r_WaterDrawRefraction 0          // 关闭水面折射
r_decals 0                       // 关闭弹孔/贴花
mp_decals 0
r_drawdetailprops 0              // 关闭细节道具
r_drawflecks 0                   // 关闭碎片
cl_ejectbrass 0                  // 关闭抛弹壳
cl_phys_props_enable 0           // 关闭道具物理
func_break_max_pieces 0          // 关闭破碎碎片
props_break_max_pieces 0
violence_agibs 0                 // 关闭血腥碎块
violence_hgibs 0
cl_ragdoll_collide 0
cl_ragdoll_physics_enable 0      // 完全关闭布娃娃物理

// ── [7] 转向系统 (重构版) ───────────────────────────
//  原版问题: +mTurnXxx_restore 全是空 alias，形同虚设
//  场景复现: 按住 Q (左转) 再按 E (右转)，然后松 Q
//            → 此时 E 应该继续生效，但 restore 为空导致卡方向
//  修复方案: 释放时 -left; -right 双清，保证状态干净
//  高速/低速: 用 alias 切换 bind，不再依赖残缺的 restore 机制

// ─ 左转向 ─
alias +mTurnLeftHigh   "-right; +left; cl_yawspeed 293.9535"
alias -mTurnLeftHigh   "-left; -right"        // 双清，防止卡方向

alias +mTurnLeftLow    "-right; +left; cl_yawspeed 110"
alias -mTurnLeftLow    "-left; -right"

// ─ 右转向 ─
alias +mTurnRightHigh  "-left; +right; cl_yawspeed 293.9535"
alias -mTurnRightHigh  "-right; -left"

alias +mTurnRightLow   "-left; +right; cl_yawspeed 110"
alias -mTurnRightLow   "-right; -left"

// ─ 模式切换 (把高低速绑到 Q/E) ─
alias "turn_speed_low"  "bind q +mTurnLeftLow; bind e +mTurnRightLow; echo >>> 转向: 低速 (110) <<<"
alias "turn_speed_high" "bind q +mTurnLeftHigh; bind e +mTurnRightHigh; echo >>> 转向: 高速 (293) <<<"

// ── [8] 空移 (Null Movement) ─────────────────────────
alias +mfwd  "-back; +forward"
alias -mfwd  "-forward; -back"
alias +mback "-forward; +back"
alias -mback "-back; -forward"
alias +mleft "-moveright; +moveleft"
alias -mleft "-moveleft; -moveright"
alias +mright "-moveleft; +moveright"
alias -mright "-moveright; -moveleft"

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

// ── [9] 按键绑定 ─────────────────────────────────────

// ─ 转向 (默认低速) ─
bind "q" "+mTurnLeftLow"
bind "e" "+mTurnRightLow"

// ─ R: 回存点 + 切高速 ─
bind "r" "sm_teleport; turn_speed_high"

// ─ ★ 新增: V 切回低速 (原版按了 R 后没法回到低速，只能重载 cfg) ─
bind "v" "turn_speed_low"

// ─ 空格: 大跳 ─
alias +Crouchjump "+duck; +jump; -forward; -back"
alias -Crouchjump "-duck; -jump; turn_speed_low"
bind "space" "+Crouchjump"

// ─ 右键: 跳跃 ─
bind "mouse2" "+jump"

// ─ ★ 新增: N 开关 net_graph ─
alias "net_on"  "net_graph 1; bind n net_off; echo >>> net_graph ON <<<"
alias "net_off" "net_graph 0; bind n net_on;  echo >>> net_graph OFF <<<"
bind "n" "net_on"

// ─ 功能键 ─
bind "x" "sm_r"                  // 重试
bind "c" "sm_saveloc"            // 保存位置
bind "f" "+teleport"             // 传送
bind "z" "sm_goto"               // 去他人位置
bind "t" "sm_spec"               // 旁观
bind "mouse3" "sm_stuck"         // 解卡
bind "mouse4" "sm_restart"       // 额外重试键

// ── [10] 杂项 ─────────────────────────────────────────
hud_fastswitch 1                 // 快速切武器
closecaption 0
cl_downloadfilter "nosounds"

// ── [11] 初始状态 ─────────────────────────────────────
turn_speed_high                  // 默认高速 (293)，跳跃自动切低速
net_off                          // 默认关闭 net_graph

// 常见 sm_ 命令 alias (防止服端覆盖)
alias "sm_r" "say /r"
alias "sm_saveloc" "say /saveloc"
alias "sm_teleport" "say /teleport"
alias "sm_goto" "say /goto"
alias "sm_spec" "say /spec"
alias "sm_stuck" "say /stuck"
alias "sm_restart" "say /restart"

echo ">>> surf110_optimized.cfg loaded — 默认高速 || 跳跃自动切低速  R切回高速 <<<"
echo ">>> [N] net_graph  [Space] 大跳+落地低速  [R] 回存点+高速 <<<"
