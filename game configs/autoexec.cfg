// =====================================================
//  autoexec_optimized.cfg — CS:S 通用启动配置
//  基于原版优化
//  优化日期: 2026-05-07
//  修复: rate/fps CS:S 适配 + 高低速可回切 + 补充 FPS 优化
// =====================================================

// ── [1] 网络 ─────────────────────────────────────────
fps_max 600                      // 原 1100 → CS:S 物理引擎 >600 可能抖
rate 30000                       // 原 786432 是 CS:GO 值，CS:S 上限 30000
cl_updaterate 100
cl_cmdrate 100
cl_interp 0
cl_interp_ratio 1
cl_lagcompensation 1
cl_smooth 0
cl_smoothtime 0
cl_resend 1.5
cl_timeout 9999

// ── [2] 多核渲染 ────────────────────────────────────
mat_queue_mode -1

// ── [3] 视角 & 手臂 ──────────────────────────────────
cl_bob 0
cl_bobcycle 2
viewmodel_fov 80

// ── [4] 准星 ─────────────────────────────────────────
cl_crosshairalpha 255
cl_crosshaircolor 5
cl_crosshairsize 3
cl_crosshairthickness 1
cl_crosshairdot 0

// ── [5] 音频 ─────────────────────────────────────────
dsp_enhance_stereo 1
snd_mixahead 0.05

// ── [6] FPS 优化（通用）──────────────────────────────
r_dynamic 0
r_3dsky 0
r_shadows 0
r_WaterDrawReflection 0
r_WaterDrawRefraction 0
r_decals 0
mp_decals 0
r_drawdetailprops 0
r_drawflecks 0
cl_ejectbrass 0
cl_phys_props_enable 0
func_break_max_pieces 0
props_break_max_pieces 0
violence_agibs 0
violence_hgibs 0
cl_ragdoll_collide 0
cl_ragdoll_physics_enable 0

// ── [7] 转向系统 ─────────────────────────────────────
// 左
alias +mTurnLeftHigh  "-right; +left; cl_yawspeed 293.9535"
alias -mTurnLeftHigh  "-left; -right"        // 双清防卡
alias +mTurnLeftLow   "-right; +left; cl_yawspeed 60"
alias -mTurnLeftLow   "-left; -right"

// 右
alias +mTurnRightHigh "-left; +right; cl_yawspeed 293.9535"
alias -mTurnRightHigh "-right; -left"
alias +mTurnRightLow  "-left; +right; cl_yawspeed 60"
alias -mTurnRightLow  "-right; -left"

// 模式切换 alias
alias "turn_speed_low"  "bind q +mTurnLeftLow; bind e +mTurnRightLow; echo >>> 转向: 低速 (60) <<<"
alias "turn_speed_high" "bind q +mTurnLeftHigh; bind e +mTurnRightHigh; echo >>> 转向: 高速 (293) <<<"

// ── [8] 空移 ────────────────────────────────────────
alias +mfwd  "-back; +forward"
alias -mfwd  "-forward; -back"
alias +mback "-forward; +back"
alias -mback "-back; -forward"
alias +mleft "-moveright; +moveleft"
alias -mleft "-moveleft; -moveright"
alias +mright "-moveleft; +moveright"
alias -mright "-moveright; -moveleft"    // 去掉多余 re-bind

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

// ── [9] 按键绑定 ─────────────────────────────────────
bind "q" "+mTurnLeftLow"
bind "e" "+mTurnRightLow"
bind "mouse2" "+jump"

// R: 回存点 + 切高速
bind "r" "sm_teleport; turn_speed_high"
// V: 切回低速 (原版按了 R 后回不来)
bind "v" "turn_speed_low"

// N: net_graph 开关
alias "net_on"  "net_graph 1; bind n net_off; echo >>> net_graph ON <<<"
alias "net_off" "net_graph 0; bind n net_on;  echo >>> net_graph OFF <<<"
bind "n" "net_on"

// 大跳
alias +Crouchjump "+duck; +jump; -forward; -back"
alias -Crouchjump "-duck; -jump; turn_speed_low"
bind "space" "+Crouchjump"

// 功能
bind "x" "sm_r"
bind "c" "sm_saveloc"
bind "f" "+teleport"
bind "z" "sm_goto"
bind "t" "sm_spec"
bind "mouse3" "sm_stuck"

// ── [10] 杂项 ─────────────────────────────────────────
hud_fastswitch 1
closecaption 0
cl_downloadfilter "nosounds"

// ── [11] 初始状态 ─────────────────────────────────────
turn_speed_high                  // 默认高速 (293)，跳跃自动切低速
net_off

alias "sm_r" "say /r"
alias "sm_saveloc" "say /saveloc"
alias "sm_teleport" "say /teleport"
alias "sm_goto" "say /goto"
alias "sm_spec" "say /spec"
alias "sm_stuck" "say /stuck"

echo ">>> autoexec_optimized.cfg loaded — 默认高速 || 跳跃自动切低速  R切回高速 <<<"
echo ">>> [N] net_graph  [Space] 大跳+落地低速  [R] 回存点+高速 <<<"
