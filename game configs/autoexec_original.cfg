// =====================================================
//  autoexec.cfg — 100 Tick 优化版 | 洛轩
//  优化时间: 2026-05-06
// =====================================================

// ── [1] 网络 (100 Tick) ──────────────────────────────
fps_max 1100
rate 786432                    // CS:S 上限 (原 3000000 无效)
cl_updaterate 100
cl_cmdrate 100
cl_interp 0
cl_interp_ratio 1
cl_lagcompensation 1
cl_smooth 0
cl_smoothtime 0
cl_resend 1.5                  // 丢包重发更快 (默认 2)
cl_timeout 9999                // 防止长时间游戏掉线

// ── [2] 多核渲染 ────────────────────────────────────
mat_queue_mode -1              // 自动多核 (9800X3D 最优)

// ── [3] 视角 & 手臂 ──────────────────────────────────
cl_bob 0                       // 关闭武器抖动 (CS:S 原生)
cl_bobcycle 2
viewmodel_fov 80

// ── [4] 准星 ─────────────────────────────────────────
cl_crosshairalpha 255
cl_crosshaircolor 5
cl_crosshairsize 3
cl_crosshairthickness 1
cl_crosshairdot 0

// ── [5] 转向系统 ─────────────────────────────────────
// 左
alias +mTurnLeftHigh  "-right; +left; cl_yawspeed 293.9535"
alias -mTurnLeftHigh  "-left"
alias +mTurnLeftLow   "-right; +left; cl_yawspeed 60"
alias -mTurnLeftLow   "-left"

// 右
alias +mTurnRightHigh "-left; +right; cl_yawspeed 293.9535"
alias -mTurnRightHigh "-right"
alias +mTurnRightLow  "-left; +right; cl_yawspeed 60"
alias -mTurnRightLow  "-right"

// ── [6] 档位控制 ─────────────────────────────────────
// R: 回存点 + 高速档
bind "r" "sm_teleport; bind q +mTurnLeftHigh; bind e +mTurnRightHigh; bind mouse2 +jump"

// ── [7] 空移 (Null Movement) ────────────────────────
alias +mfwd  "-back; +forward"
alias -mfwd  "-forward; -back"
alias +mback "-forward; +back"
alias -mback "-back; -forward"
alias +mleft "-moveright; +moveleft"
alias -mleft "-moveleft; -moveright"
// 松 D: 自动降速
alias +mright "-moveleft; +moveright"
alias -mright "-moveright; -moveleft; bind q +mTurnLeftLow; bind e +mTurnRightLow; bind mouse2 +jump"

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

// ── [8] 按键绑定 ─────────────────────────────────────
bind "q" "+mTurnLeftLow"
bind "e" "+mTurnRightLow"
bind "mouse2" "+jump"
// MOUSE1 默认 +attack 不绑定

// 大跳
alias +Crouchjump "+duck; +jump; -forward; -back"
alias -Crouchjump "-duck; -jump"
bind "space" "+Crouchjump"

// 功能
bind "x" "sm_r"
bind "c" "sm_saveloc"
bind "f" "+teleport"
bind "z" "sm_goto"
bind "t" "sm_spec"
bind "mouse3" "sm_stuck"

// ── [9] 杂项 ─────────────────────────────────────────
cl_ragdoll_collide 0
hud_fastswitch 1
closecaption 0
cl_downloadfilter "nosounds"

echo ">>> autoexec.cfg loaded — 100 tick <<<"
