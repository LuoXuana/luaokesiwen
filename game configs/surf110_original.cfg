// =====================================================
//  surf110.cfg — CS:S Surf 100 Tick | yawspeed 110 | 洛轩专用
//  优化时间: 2026-05-06
// =====================================================

// ── [1] 网络设置 (100 Tick 优化) ─────────────────────
fps_max 1100
rate 786432                    // CS:S 最大合法值，原 3000000 无效
cl_updaterate 100              // 匹配 100 tick
cl_cmdrate 100                 // 匹配 100 tick
cl_interp 0                    // 关闭插值
cl_interp_ratio 1
cl_lagcompensation 1
cl_smooth 0                    // 关闭视角平滑 → 更跟手
cl_smoothtime 0
cl_resend 1.5                  // 丢包重发更快 (默认 2)
cl_timeout 9999                // 防止长时间 surf 掉线

// ── [2] 多核渲染 ────────────────────────────────────
mat_queue_mode -1              // 自动多核 (9800X3D 最优)

// ── [3] 视角 & 手臂优化 ─────────────────────────────
cl_bob 0                       // 关闭武器抖动 (CS:S 原生)
cl_bobcycle 2
viewmodel_fov 80               // 手臂更靠前，视野更开阔

// ── [4] 准星 ────────────────────────────────────────
cl_crosshairalpha 255
cl_crosshaircolor 5            // 青色
cl_crosshairsize 3
cl_crosshairthickness 1
cl_crosshairdot 0

// ── [5] 音频 ────────────────────────────────────────
dsp_enhance_stereo 1
snd_mixahead 0.05              // 低延迟 (若爆音，改回 0.08~0.10)

// ── [6] FPS 优化 (去掉所有非 surf 开销) ──────────────
r_dynamic 0                    // 关闭动态光照
r_3dsky 0                      // 关闭 3D 天空盒
r_shadows 0                    // 关闭阴影
r_WaterDrawReflection 0        // 关闭水面反射
r_WaterDrawRefraction 0        // 关闭水面折射
r_decals 0                     // 关闭弹孔/贴花
mp_decals 0
r_drawdetailprops 0            // 关闭细节道具
r_drawflecks 0                 // 关闭碎片
cl_ejectbrass 0                // 关闭抛弹壳
cl_phys_props_enable 0         // 关闭道具物理
func_break_max_pieces 0        // 关闭破碎碎片
props_break_max_pieces 0
violence_agibs 0               // 关闭血腥碎块
violence_hgibs 0
cl_ragdoll_collide 0
cl_ragdoll_physics_enable 0    // 完全关闭布娃娃物理

// ── [7] 转向系统 (保留原有高速/低速档) ──────────────

// 左转向 — 高速 (293.95 = 360°单帧)
alias +mTurnLeftHigh  "-right; +left; cl_yawspeed 293.9535"
alias -mTurnLeftHigh  "-left; +mTurnRightHigh_restore"

// 左转向 — 低速
alias +mTurnLeftLow   "-right; +left; cl_yawspeed 110"
alias -mTurnLeftLow   "-left; +mTurnRightLow_restore"

// 右转向 — 高速
alias +mTurnRightHigh "-left; +right; cl_yawspeed 293.9535"
alias -mTurnRightHigh "-right; +mTurnLeftHigh_restore"

// 右转向 — 低速
alias +mTurnRightLow  "-left; +right; cl_yawspeed 110"
alias -mTurnRightLow  "-right; +mTurnLeftLow_restore"

// 释放转向时：恢复另一个方向的绑定（如果正在按住）
alias +mTurnLeftHigh_restore  ""
alias +mTurnLeftLow_restore   ""
alias +mTurnRightHigh_restore ""
alias +mTurnRightLow_restore  ""

// ── [8] 空移 (Null Movement) ─────────────────────────
alias +mfwd  "-back; +forward"
alias -mfwd  "-forward; -back"
alias +mback "-forward; +back"
alias -mback "-back; -forward"
alias +mleft "-moveright; +moveleft"
alias -mleft "-moveleft; -moveright"
alias +mright "-moveleft; +moveright"
alias -mright "-moveright; -moveleft; bind q +mTurnLeftLow; bind e +mTurnRightLow; bind mouse2 +jump"

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

// ── [9] 按键绑定 ─────────────────────────────────────

// 转向键 (默认低速)
bind "q" "+mTurnLeftLow"
bind "e" "+mTurnRightLow"

// R: 回存点 + 切高速档
bind "r" "sm_teleport; bind q +mTurnLeftHigh; bind e +mTurnRightHigh"

// 空格: 大跳
alias +Crouchjump "+duck; +jump; -forward; -back"
alias -Crouchjump "-duck; -jump"
bind "space" "+Crouchjump"

// 右键: 跳跃
bind "mouse2" "+jump"

// 功能键
bind "x" "sm_r"                // 重试
bind "c" "sm_saveloc"          // 保存位置
bind "f" "+teleport"           // 传送
bind "z" "sm_goto"             // 去他人位置
bind "t" "sm_spec"             // 旁观
bind "mouse3" "sm_stuck"       // 解卡
bind "mouse4" "sm_restart"     // 额外重试键

// ── [10] 杂项 ─────────────────────────────────────────
cl_showfps 0                   // 需要时手动 net_graph 1
hud_fastswitch 1               // 快速切武器
closecaption 0
cl_downloadfilter "nosounds"

// ── [11] 初始状态 ─────────────────────────────────────
bind "q" "+mTurnLeftLow"
bind "e" "+mTurnRightLow"
bind "mouse2" "+jump"

echo ">>> surf110.cfg loaded — 100 tick | yawspeed 110 | FPS optimized <<<"
