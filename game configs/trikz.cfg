// =====================================================
//  trikz_optimized.cfg — CS:S Trikz 专用配置
//  基于原版优化
//  优化日期: 2026-05-07
//  修复: rate 超限 + 重复 bind + 补充基础网络/FPS 优化
// =====================================================

// ── [1] 网络设置 ─────────────────────────────────────
fps_max 400                      // Trikz 不需要高 fps，400 足够稳定
rate 30000                       // 原 3000000 超 CS:S 上限，改回 30000
cl_updaterate 102                // 兼顾多数百 tick 服
cl_cmdrate 102
cl_interp 0
cl_interp_ratio 1
cl_interp_all 0
cl_lagcompensation 1
cl_smooth 0
cl_smoothtime 0
cl_resend 1.5
cl_timeout 9999

// ── [2] 多核渲染 ────────────────────────────────────
mat_queue_mode -1

// ── [3] FPS 优化 ─────────────────────────────────────
r_dynamic 0
r_3dsky 0
r_shadows 0
r_WaterDrawReflection 0
r_WaterDrawRefraction 0
r_decals 0
mp_decals 0
r_drawdetailprops 0
r_drawflecks 0
cl_ejectbrass 0
cl_phys_props_enable 0
func_break_max_pieces 0
props_break_max_pieces 0
violence_agibs 0
violence_hgibs 0
cl_ragdoll_collide 0
cl_ragdoll_physics_enable 0

// ── [4] 按键绑定 ─────────────────────────────────────
bind "r" "sm_block"
bind "f" "sm_tele"               // 原版写了两次，去重
bind "mouse1" "+macro"
bind "mouse2" "+jump"

// ── [5] 视角 ─────────────────────────────────────────
sensitivity 0.9
cl_yawspeed 210

// ── [6] 杂项 ─────────────────────────────────────────
hud_fastswitch 1
closecaption 0
cl_downloadfilter "nosounds"

// ── [7] 辅助工具 ─────────────────────────────────────
// N: net_graph 开关
alias "net_on"  "net_graph 1; bind n net_off; echo >>> net_graph ON <<<"
alias "net_off" "net_graph 0; bind n net_on;  echo >>> net_graph OFF <<<"
bind "n" "net_on"

echo ">>> trikz_optimized.cfg loaded — rate 已修正 + FPS 优化 <<<"
echo ">>> [N] net_graph  [R] sm_block  [F] sm_tele <<<"
